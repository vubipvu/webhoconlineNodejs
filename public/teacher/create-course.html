<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Thêm Khóa Học Mới</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      padding: 40px;
    }
    h1 {
      color: #333;
      text-align: center;
    }
    form {
      max-width: 500px;
      margin: auto;
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 15px;
      font-size: 16px;
    }
    button {
      background-color: #007bff;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <h1>Thêm Khóa Học Mới</h1>
  <form id="createCourseForm">
    <input type="text" name="title" placeholder="Tên khóa học" required>
    <input type="text" name="description" placeholder="Mô tả khóa học" required>
    <input type="file" name="image" accept="image/*" required>
    <button type="submit">Thêm khóa học</button>
    <button class="btn btn-outline-secondary btn-sm" onclick="goBack()">🔙 Trở về</button>

  </form>
  
  

  <script>
    document.getElementById('createCourseForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const form = new FormData(e.target);
      const token = localStorage.getItem('token');

      const formData = new FormData();
      formData.append('title', form.get('title'));
      formData.append('description', form.get('description'));
      formData.append('image', form.get('image'));

      try {
        const res = await fetch('/api/courses', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + token
          },
          body: formData
        });

        const result = await res.json();
        if (res.ok) {
          alert('✅ Khóa học đã được tạo thành công!');
          window.location.href = "/teacher/courses.html"; // Chuyển sang danh sách
        } else {
          alert(result.message || '❌ Lỗi khi tạo khóa học!');
        }
      } catch (err) {
        alert('❌ Lỗi hệ thống!');
      }
    });
    function goBack() {
  window.history.back(); // hoặc window.location.href = '/student' nếu bạn muốn về trang cụ thể
}
  </script>
</body>
</html>
