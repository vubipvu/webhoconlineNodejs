<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Danh sách khóa học</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: #f4f7fa;
      margin: 0;
      padding: 40px;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
    }

    .course-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .course-item {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      position: relative;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .course-item:hover {
      transform: translateY(-10px);
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
    }

    .course-item img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
    }

    .course-item h3 {
      margin-top: 15px;
      font-size: 18px;
      font-weight: 500;
      color: #333;
    }

    .course-item p {
      font-size: 14px;
      color: #555;
      margin: 10px 0;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
    }

    .actions button {
      padding: 8px 12px;
      font-size: 14px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .actions .save-btn {
      background-color: #4caf50;
      color: white;
    }

    .actions .save-btn:hover {
      background-color: #45a049;
    }

    .actions .delete-btn {
      background-color: #f44336;
      color: white;
    }

    .actions .delete-btn:hover {
      background-color: #e53935;
    }

    .no-courses {
      text-align: center;
      color: #777;
      font-size: 16px;
    }
    .actions .edit-btn {
  background-color: #2196f3;
  color: white;
}

.actions .edit-btn:hover {
  background-color: #1976d2;
}

.actions .cancel-btn {
  background-color: #9e9e9e;
  color: white;
}

.actions .cancel-btn:hover {
  background-color: #757575;
}

  </style>
</head>
<body>
  <h1>Danh sách khóa học</h1>
  <div class="text-end mb-4">
    <button class="btn btn-outline-danger btn-sm" onclick="logout()">🚪 Đăng xuất</button>
  </div>
  
  
  <div class="text-center mb-4">
    <a href="/teacher/create-course.html" class="btn btn-primary">➕ Thêm Mới Khóa Học</a>
  </div>
  <div class="text-center">
    <!-- <h2 class="mb-4">🎉 Chào mừng bạn đã đăng nhập với quyền <strong>sinh viên</strong></h2> -->
    <a href="/chat.html" class="btn btn-outline-primary btn-sm mt-3">💬 Vào phòng chat</a>
  </div>
  <div class="course-list" id="courses"></div>

  <script>
    async function fetchCourses() {
      try {
        const res = await fetch('/api/courses');
        const courses = await res.json();
        const container = document.getElementById('courses');
        container.innerHTML = '';
  
        if (courses.length === 0) {
          container.innerHTML = '<div class="no-courses">Không có khóa học nào.</div>';
        } else {
          container.innerHTML = courses.map(course => `
            <div class="course-item" data-id="${course._id}">
                <img src="/images/${course.image}" alt="${course.title}" onerror="this.src='/images/default.jpg'">
                <input type="file" class="form-control form-control-sm mt-2 file-input d-none" accept="image/*">
                <h3 class="edit-title" contenteditable="false">${course.title}</h3>
                <p class="edit-desc" contenteditable="false">${course.description}</p>
                <div class="actions mt-2 gap-2 flex-wrap">
                    
                <a href="/teacher/add_quiz.html?courseId=${course._id}" class="btn btn-warning btn-sm">➕ Thêm câu hỏi</a>

                <button class="edit-btn btn btn-primary btn-sm" onclick="enableEdit(this)">✏️ Sửa</button>
                <button class="save-btn btn btn-success btn-sm d-none" onclick="saveCourseWithImage('${course._id}', this)">💾 Lưu</button>
                <button class="cancel-btn btn btn-secondary btn-sm d-none" onclick="cancelEdit(this)">❌ Hủy</button>
                <button class="delete-btn btn btn-danger btn-sm" onclick="deleteCourse('${course._id}')">🗑️ Xóa</button>
                <a href="/quiz.html?courseId=${course._id}" class="btn btn-outline-primary btn-sm">📘 Làm bài kiểm tra</a>
                </div>
            </div>
          `).join('');
        }
      } catch (err) {
        alert('Lỗi khi tải khóa học: ' + err.message);
      }
    }
  
    function enableEdit(btn) {
      const item = btn.closest('.course-item');
      const titleEl = item.querySelector('.edit-title');
      const descEl = item.querySelector('.edit-desc');
      const fileInput = item.querySelector('.file-input');
      const saveBtn = item.querySelector('.save-btn');
      const cancelBtn = item.querySelector('.cancel-btn');
  
      // Lưu dữ liệu cũ
      titleEl.setAttribute('data-old', titleEl.innerText);
      descEl.setAttribute('data-old', descEl.innerText);
  
      titleEl.contentEditable = true;
      descEl.contentEditable = true;
      fileInput.classList.remove('d-none');
      titleEl.focus();
  
      btn.classList.add('d-none');
      saveBtn.classList.remove('d-none');
      cancelBtn.classList.remove('d-none');
    }
  
    function cancelEdit(btn) {
      const item = btn.closest('.course-item');
      const titleEl = item.querySelector('.edit-title');
      const descEl = item.querySelector('.edit-desc');
      const fileInput = item.querySelector('.file-input');
      const editBtn = item.querySelector('.edit-btn');
      const saveBtn = item.querySelector('.save-btn');
  
      titleEl.innerText = titleEl.getAttribute('data-old');
      descEl.innerText = descEl.getAttribute('data-old');
  
      titleEl.contentEditable = false;
      descEl.contentEditable = false;
      fileInput.classList.add('d-none');
      fileInput.value = '';
  
      editBtn.classList.remove('d-none');
      saveBtn.classList.add('d-none');
      btn.classList.add('d-none');
    }
  
    async function saveCourseWithImage(id, btn) {
      const item = btn.closest('.course-item');
      const titleEl = item.querySelector('.edit-title');
      const descEl = item.querySelector('.edit-desc');
      const fileInput = item.querySelector('.file-input');
      const editBtn = item.querySelector('.edit-btn');
      const cancelBtn = item.querySelector('.cancel-btn');
  
      const title = titleEl.innerText.trim();
      const description = descEl.innerText.trim();
      const imageFile = fileInput.files[0];
  
      if (!title || !description) {
        return alert('Tên và mô tả không được để trống');
      }
  
      const formData = new FormData();
      formData.append('title', title);
      formData.append('description', description);
      if (imageFile) {
        formData.append('image', imageFile);
      }
  
      try {
        const res = await fetch(`/api/courses/${id}`, {
          method: 'PUT',
          body: formData
        });
  
        const data = await res.json();
        if (res.ok) {
          alert(data.message || 'Đã cập nhật thành công');
          fetchCourses();
        } else {
          alert(data.message || 'Lỗi khi cập nhật');
        }
      } catch (err) {
        alert('Lỗi khi lưu khóa học: ' + err.message);
      }
    }
  
    async function deleteCourse(id) {
      if (!confirm("Bạn chắc chắn muốn xóa khóa học này?")) return;
      try {
        const res = await fetch(`/api/courses/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (res.ok) {
          alert(data.message || 'Đã xóa thành công');
          fetchCourses();
        } else {
          alert(data.message || 'Lỗi khi xóa');
        }
      } catch (err) {
        alert('Lỗi khi xóa khóa học: ' + err.message);
      }
    }
    function logout() {
  localStorage.removeItem('token');
  window.location.href = '/login';
}

  
    fetchCourses();
  </script>
  
  
</body>
</html>
